name: Build Echo Music APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Echo Music Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK Files
        id: stage_apk
        run: |
          mkdir -p final_apk
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="5.3.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "final_apk/Echo-Music-v${VERSION}.apk"
          else
            echo "No APK found"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Music-APK
          path: final_apk/*

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.3.0
          name: "Echo Music v5.3.0"
          body: |
            ## Echo Music v5.3.0 🎵
            
            100% newly compiled native Android build with Echo Music branding!
            
            - **App Name:** Echo Music
            - **Developer:** Akash Tiwari ([@1227akash](https://github.com/1227akash))
          files: final_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
